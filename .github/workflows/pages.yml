name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build Firebase client
        working-directory: client
        env:
          VITE_DATA_BACKEND: firebase
          VITE_GITHUB_PAGES: "true"
          VITE_ROUTER_MODE: hash
          VITE_FIREBASE_API_KEY: "AIzaSyAz4v4B9vP3WzRWSsFXheaLz-9Sfts-fYs"
          VITE_FIREBASE_AUTH_DOMAIN: "vibe-workceck.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "vibe-workceck"
          VITE_FIREBASE_STORAGE_BUCKET: "vibe-workceck.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "184048401085"
          VITE_FIREBASE_APP_ID: "1:184048401085:web:ae47cb993f2626fb2555d4"
          VITE_FIREBASE_MEASUREMENT_ID: "G-0D1VL6T29P"
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

